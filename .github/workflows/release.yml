name: Release

# Publishes to npm only from a version tag, so work in progress never ships.
# Tag a release with:  pnpm version:tag 0.1.0-alpha.1   (see docs/RELEASING.md)
on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Check the tag matches the package version
        shell: bash
        run: |
          set -e
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/blockwright/package.json').version")
          if [ "$TAG" != "$PKG" ]; then echo "Tag $TAG does not match package version $PKG"; exit 1; fi
      - name: Publish to npm
        run: pnpm -r --filter "./packages/*" publish --access public --no-git-checks --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
